<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <style>
    .text-primary { fill: #111827; }
    .text-secondary { fill: #6B7280; }
    @media (prefers-color-scheme: dark) {
      .text-primary { fill: #F9FAFB; }
      .text-secondary { fill: #9CA3AF; }
    }
  </style>

  <!-- Logo Mark -->
  <g transform="translate(160, 45)">
    <!-- Stacked Cards / Tickets -->
    <rect x="0" y="20" width="70" height="70" rx="16" fill="#60A5FA" opacity="0.8" transform="rotate(-15 35 55)" />
    <rect x="25" y="10" width="70" height="70" rx="16" fill="#3B82F6" opacity="0.9" transform="rotate(-5 60 45)" />
    <rect x="50" y="0" width="70" height="70" rx="16" fill="#1D4ED8" />
    
    <!-- Checkmark on front card -->
    <path d="M 68 38 L 78 48 L 98 28" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography -->
  <text x="320" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" class="text-primary" letter-spacing="-1.5">
    QueueFlow
  </text>
  <text x="325" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="text-secondary" letter-spacing="5">
    ONLINE QUEUING SYSTEM
  </text>
</svg>
